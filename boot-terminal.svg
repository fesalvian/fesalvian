<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">FS SYSTEMS — Animated system boot terminal</title>
<desc id="desc">Terminal initialization displaying profile, development stack, hardware lab and Instagram @salviandev</desc>
<defs>
 <linearGradient id="base" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#030b17"/><stop offset="1" stop-color="#071e31"/></linearGradient>
 <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#0d4263"/><stop offset=".48" stop-color="#35d4ff"/><stop offset="1" stop-color="#0d4263"/></linearGradient>
 <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H1200" stroke="#43bff0" stroke-opacity=".04"/></pattern>
 <style>
 .line{animation:appear .5s both;opacity:1}.l1{animation-delay:.15s}.l2{animation-delay:.8s}.l3{animation-delay:1.45s}.l4{animation-delay:2.1s}.l5{animation-delay:2.75s}.l6{animation-delay:3.4s}
 .cursor{animation:blink 1s steps(2,end) infinite}.led{animation:breathe 2.5s ease-in-out infinite}
 .progress{animation:bar 4.0s ease-out both;transform-origin:88px 252px}
 @keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
 @keyframes blink{50%{opacity:0}}@keyframes breathe{50%{opacity:.3}}@keyframes bar{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
 @media(prefers-reduced-motion:reduce){.line,.cursor,.led,.progress{animation:none}}
 </style>
</defs>
<rect width="1200" height="300" rx="12" fill="url(#base)" stroke="#176187" stroke-width="2"/>
<rect x="12" y="12" width="1176" height="276" rx="6" fill="none" stroke="#174a68"/>
<path d="M16 45H1183" stroke="url(#edge)" stroke-width="1.5"/>
<rect x="16" y="16" width="1168" height="29" fill="#0a263b"/>
<circle class="led" cx="34" cy="30" r="5" fill="#00e5d2"/><circle cx="54" cy="30" r="5" fill="#1681a9"/><circle cx="74" cy="30" r="5" fill="#175273"/>
<text x="94" y="35" fill="#a7d8ee" font-size="14" font-family="Consolas,monospace" letter-spacing="1">FS://BOOT/PROFILE</text>
<text x="1152" y="35" text-anchor="end" fill="#50bcd7" font-size="12" font-family="Consolas,monospace">SECURE // ONLINE</text>
<g font-family="Consolas, 'Courier New',monospace" font-size="20">
 <g class="line l1"><text x="48" y="82" fill="#5ae5f7">$</text><text x="73" y="82" fill="#e6f8ff">init developer --user fesalvian</text><text x="850" y="82" fill="#4f99b2" font-size="13">SYS_BOOT :: 001</text></g>
 <g class="line l2"><text x="48" y="117" fill="#70f5bb">[OK]</text><text x="118" y="117" fill="#b4dce9">Identity: FELIPE SALVIANO</text></g>
 <g class="line l3"><text x="48" y="152" fill="#70f5bb">[OK]</text><text x="118" y="152" fill="#b4dce9">Core: TypeScript / Next.js / Node.js / PostgreSQL / Python</text></g>
 <g class="line l4"><text x="48" y="187" fill="#70f5bb">[OK]</text><text x="118" y="187" fill="#b4dce9">Modules: AI / Robotics / Embedded Systems / Prototyping</text></g>
 <g class="line l5"><text x="48" y="222" fill="#70f5bb">[OK]</text><text x="118" y="222" fill="#b4dce9">Uplink: instagram.com/salviandev</text></g>
 <g class="line l6"><text x="48" y="272" fill="#57dafa">&gt;</text><text x="73" y="272" fill="#d0faff"> Ready to build what doesn't exist yet.</text><rect class="cursor" x="633" y="255" width="10" height="19" fill="#6af5fc"/></g>
</g>
<rect x="88" y="246" width="1020" height="2" fill="#174c69"/><rect class="progress" x="88" y="246" width="1020" height="2" fill="#36dafc"/>
<path d="M1085 60H1159V230H1085" fill="none" stroke="#266685" stroke-width="1" stroke-dasharray="4 7" opacity=".7"/>
</svg>