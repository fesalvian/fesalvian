<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">Felipe Salviano developer HUD</title><desc id="desc">Futuristic cyan developer interface with animated reactor-inspired rings</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020814"/><stop offset=".6" stop-color="#081c2d"/><stop offset="1" stop-color="#020714"/></linearGradient>
<linearGradient id="line"><stop stop-color="#0aa3cf"/><stop offset=".6" stop-color="#a5f5ff"/><stop offset="1" stop-color="#006c9e"/></linearGradient>
<radialGradient id="core"><stop stop-color="#f1ffff"/><stop offset=".25" stop-color="#90f2ff"/><stop offset=".65" stop-color="#0baedb" stop-opacity=".55"/><stop offset="1" stop-color="#00aef1" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#58d9ff" stroke-opacity=".085"/></pattern>
<style>
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}.rev{animation-direction:reverse;animation-duration:17s}.glow{animation:pulse 3s ease-in-out infinite}.blink{animation:pulse 1.1s steps(2,end) infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.orbit,.glow,.blink{animation:none}}
</style></defs>
<rect width="1200" height="350" fill="url(#bg)"/><rect width="1200" height="350" fill="url(#grid)"/>
<path d="M20 55V20H65M1135 20H1180V60M20 295V330H65M1135 330H1180V290" fill="none" stroke="#48dfff" stroke-width="2"/>
<path d="M45 56H1155M45 301H1155" stroke="#2ed1f6" stroke-opacity=".25"/>
<path d="M48 56H280M48 301H415" stroke="url(#line)" stroke-width="2"/>
<g font-family="Consolas, 'Liberation Mono', monospace"><text x="62" y="88" fill="#66d9f1" font-size="15" letter-spacing="3">FS // DEVELOPER INTERFACE</text>
<text x="60" y="168" fill="#effcff" font-family="Arial, sans-serif" font-size="67" font-weight="bold" letter-spacing="1">FELIPE SALVIANO</text>
<path d="M62 185H704" stroke="url(#line)" stroke-width="2"/>
<text x="62" y="222" fill="#abebf6" font-size="20" letter-spacing="2">FULL-STACK DEVELOPER</text>
<text x="62" y="250" fill="#80b6c8" font-size="15" letter-spacing="1">SOFTWARE  /  ROBOTICS  /  EMBEDDED SYSTEMS</text>
<rect x="60" y="267" width="550" height="27" rx="3" fill="#0b2b40" stroke="#2c7794" stroke-opacity=".7"/>
<circle class="blink" cx="78" cy="280" r="4" fill="#74f1d6"/><text x="92" y="285" fill="#b4effc" font-size="12" letter-spacing=".8">CODING SINCE 2017  //  BUILDING WHAT'S NEXT</text>
<text x="62" y="324" fill="#4f93ac" font-size="11" letter-spacing="2">PROFILE: FESALVIAN // SYSTEM ONLINE</text></g>
<g transform="translate(1005 169)">
<circle r="128" fill="#19a9cf" opacity=".055"/><circle r="118" fill="none" stroke="#39b3df" stroke-opacity=".3"/><circle r="105" fill="none" stroke="#64dfff" stroke-opacity=".28"/>
<g class="orbit"><circle r="113" fill="none" stroke="#42dafa" stroke-width="4" stroke-dasharray="14 25 72 37"/><circle cx="0" cy="-113" r="4" fill="#b8faff"/></g>
<g class="orbit rev"><circle r="91" fill="none" stroke="#7ceaff" stroke-width="3" stroke-dasharray="57 17 9 14"/></g>
<g class="orbit"><path d="M0-73L63-36V36L0 73L-63 36V-36Z" fill="none" stroke="#6de6ff" stroke-width="2"/></g>
<circle class="glow" r="61" fill="url(#core)"/><circle r="43" fill="#03233a" stroke="#aaf6ff" stroke-width="2"/><circle r="34" fill="none" stroke="#42daff" stroke-dasharray="3 5" stroke-width="2"/>
<text x="0" y="10" text-anchor="middle" font-size="31" font-family="Consolas,monospace" font-weight="bold" fill="#e8feff">FS</text><path d="M-145 0H-125M125 0H145M0-145V-125M0 125V145" stroke="#76e7ff" stroke-width="2"/></g>
<text x="1005" y="330" text-anchor="middle" font-family="Consolas,monospace" font-size="12" letter-spacing="2" fill="#79c8db">REACTOR // ONLINE</text>
</svg>
